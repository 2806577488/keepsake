# Keepsake（留声）— GitHub Actions 自动构建 arm64 Release APK。
#
# 触发：
#   1. push tag `v*`（如 v0.4.14）→ 版本号 = tag 去掉 v 前缀；
#   2. workflow_dispatch（手动）→ 可填 version（不带 v 前缀）；留空则取 pubspec.yaml 的版本。
#
# 签名（不硬编码任何密钥）：
#   - 仓库 Secrets 中存在 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#     → 解出 android/keystore.jks、写 android/key.properties，release 走正式签名；
#   - 不存在 → 两个文件都不生成，android/app/build.gradle.kts 回退 debug 签名，
#     构建依然成功（产物可安装，但不能覆盖签名不同的正式版）。
name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要构建的版本号（不带 v 前缀）。留空则取 pubspec.yaml 里的版本'
        required: false
        default: ''

# 创建 / 更新 Release 需要写内容权限。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 arm64 APK
    runs-on: ubuntu-latest
    env:
      # secrets 通过 job 级 env 注入步骤，workflow 文件里不出现任何密钥字面量。
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            RAW="$INPUT_VERSION"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME}"
          else
            # 单进程取版本，避免 sed | head 在 pipefail 下被 SIGPIPE 打断。
            RAW="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          fi
          # 去掉 v 前缀与 +buildNumber 后缀。
          VERSION="${RAW#v}"
          VERSION="${VERSION%%+*}"
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo '错误：无法确定版本号（tag 为空或 pubspec.yaml 缺少 version）' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$VERSION"

      - name: 安装依赖
        run: flutter pub get

      - name: 配置 release 签名
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            # 相对 android/ 目录；build.gradle.kts 用 rootProject.file() 解析。
            echo "storeFile=keystore.jks"
          } > android/key.properties
          test -s android/keystore.jks
          echo '已写入 android/keystore.jks 与 android/key.properties（release 正式签名）'

      - name: 提示使用调试签名
        if: env.KEYSTORE_BASE64 == ''
        run: echo '未配置签名 Secrets，release APK 将使用 debug 签名。'

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 release APK
        run: |
          set -euo pipefail
          # Maven Central 会对 CI 共享 IP 返回 429（Too Many Requests），
          # 这是临时性限流：失败后重试，最多 3 次。
          # 同时打包 32 位（arm）与 64 位（arm64）：Android 8–10 的老低端机多是 32 位，
          # 只出 arm64 会「装上就崩/装不上」。体积大一些，换兼容性。
          for attempt in 1 2 3; do
            echo "构建尝试 $attempt/3"
            if flutter build apk --release --target-platform android-arm,android-arm64; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo '构建失败，20 秒后重试（大概率是 Maven 限流，不是代码问题）'
              sleep 20
            fi
          done
          echo '三次构建均失败，请查看上方 Gradle 日志' >&2
          exit 1

      - name: 重命名产物并生成 SHA256
        id: artifact
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APK="keepsake-${VERSION}-universal.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK}"
          ( cd dist && sha256sum "$APK" > "${APK}.sha256" )
          cat "dist/${APK}.sha256"
          echo "apk=dist/${APK}" >> "$GITHUB_OUTPUT"
          echo "sha256=dist/${APK}.sha256" >> "$GITHUB_OUTPUT"

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Keepsake v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.sha256 }}
