# Tuned for a 10C/16T, 32GB box that is ALSO running the emulator + DSH NEXT.
# - 5G heap avoids GC thrash (12G caused the JVM to die mid-build once).
# - 6 workers leaves headroom for the emulator's realtime load; build-apk.ps1
#   rewrites this line per profile (4 when the emulator runs, 10 for a solo build).
# - 4h daemon idle timeout: a cold daemon costs 15-40s of JVM start + config +
#   dependency verification on every build; stopping it after each build was a
#   net loss for this workflow. `build-apk.ps1 -Profile stop` stops it explicitly.
# - vfs.watch keeps Gradle's file-system state incremental.
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=6
org.gradle.daemon=true
org.gradle.daemon.idletimeout=14400000
org.gradle.vfs.watch=true
org.gradle.configureondemand=false
# Kotlin 守护进程在 Windows 上偶发 0xC0000409（STATUS_STACK_BUFFER_OVERRUN）崩溃，
# Gradle 每个模块会重试 4 次并自动绕过（非致命，但日志很脏）。关掉 Parallel GC 减压。
kotlin.daemon.jvmargs=-Xmx2560m -XX:-UseParallelGC
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.newDsl=false
android.builtInKotlin=false

# 2026-11-22 重建：代理/TUN 会掐死半死连接，Gradle 默认无超时会永久挂住。
# 给出连接/读取超时与重试，让失败快速暴露并重试。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.initial.backoff=500
